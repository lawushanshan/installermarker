name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify tag matches package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "v${package_version}" = "$GITHUB_REF_NAME"
      - run: npm pack
      - name: Prepare release assets
        id: assets
        run: |
          shopt -s nullglob
          artifacts=(installermarker-*.tgz)
          test "${#artifacts[@]}" -eq 1
          checksum="${artifacts[0]}.sha256"
          sha256sum "${artifacts[0]}" > "$checksum"
          echo "tarball=${artifacts[0]}" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - name: Attest release tarball
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: ${{ steps.assets.outputs.checksum }}
      - name: Create GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.assets.outputs.tarball }}" "${{ steps.assets.outputs.checksum }}" \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish package with provenance
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}