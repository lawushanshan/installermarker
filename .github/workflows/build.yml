name: Build Local Installers

on:
  workflow_dispatch:
    inputs:
      recipe_path:
        description: Path to a reviewed JSON or YAML recipe committed in this repository.
        required: true
        type: string
      target:
        description: Target platform to build.
        required: true
        default: all
        type: choice
        options: [all, windows-x64, macos-universal, linux-x64]

permissions:
  contents: read

jobs:
  windows:
    if: ${{ inputs.target == 'all' || inputs.target == 'windows-x64' }}
    runs-on: windows-latest
    timeout-minutes: 45
    environment: source-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node ./bin/installermarker.js validate "${{ inputs.recipe_path }}" --recipe-root "$env:GITHUB_WORKSPACE"
      - run: node ./bin/installermarker.js build "${{ inputs.recipe_path }}" --recipe-root "$env:GITHUB_WORKSPACE" --target windows-x64 --workspace "$env:RUNNER_TEMP\\installermarker-source" --output-dir "$env:RUNNER_TEMP\\installermarker-artifacts" --allow-unsafe-local-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-installers-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/installermarker-artifacts
          if-no-files-found: error
          retention-days: 14

  macos:
    if: ${{ inputs.target == 'all' || inputs.target == 'macos-universal' }}
    runs-on: macos-latest
    timeout-minutes: 45
    environment: source-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node ./bin/installermarker.js validate "${{ inputs.recipe_path }}" --recipe-root "$GITHUB_WORKSPACE"
      - run: node ./bin/installermarker.js build "${{ inputs.recipe_path }}" --recipe-root "$GITHUB_WORKSPACE" --target macos-universal --workspace "$RUNNER_TEMP/installermarker-source" --output-dir "$RUNNER_TEMP/installermarker-artifacts" --allow-unsafe-local-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-installers-macos-${{ github.run_id }}
          path: ${{ runner.temp }}/installermarker-artifacts
          if-no-files-found: error
          retention-days: 14

  linux:
    if: ${{ inputs.target == 'all' || inputs.target == 'linux-x64' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: source-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Linux desktop build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: node ./bin/installermarker.js validate "${{ inputs.recipe_path }}" --recipe-root "$GITHUB_WORKSPACE"
      - run: node ./bin/installermarker.js build "${{ inputs.recipe_path }}" --recipe-root "$GITHUB_WORKSPACE" --target linux-x64 --workspace "$RUNNER_TEMP/installermarker-source" --output-dir "$RUNNER_TEMP/installermarker-artifacts" --allow-unsafe-local-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-installers-linux-${{ github.run_id }}
          path: ${{ runner.temp }}/installermarker-artifacts
          if-no-files-found: error
          retention-days: 14
