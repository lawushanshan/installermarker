name: Bug report
description: Report an incorrect analysis result or CLI failure.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: InstallerMarker version
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Repository URL
      description: Share only public repository URLs. Do not include access tokens.
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
